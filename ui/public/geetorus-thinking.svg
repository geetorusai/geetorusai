<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
  <style>
    @keyframes draw {
      0%       { stroke-dasharray: 0 100; stroke-dashoffset: -100; opacity: 1; animation-timing-function: cubic-bezier(0.455, 0.03, 0.515, 0.955); }
      39.0625% { stroke-dasharray: 100 100; stroke-dashoffset: 0; opacity: 1; animation-timing-function: cubic-bezier(0.55, 0.055, 0.675, 0.19); }
      78.1250% { stroke-dasharray: 0 100; stroke-dashoffset: 0; opacity: 1; }
      78.2250% { opacity: 0; }
      100%     { stroke-dasharray: 0 100; stroke-dashoffset: 0; opacity: 0; }
    }
    .p { animation: draw 1s linear infinite; transform-origin: 50% 50%; }
  </style>
  <circle class="p" cx="12" cy="12" r="8" pathLength="100" fill="none" stroke="#ffffff"
          stroke-width="2.5" stroke-linecap="round" transform="rotate(-90 12 12)"/>
</svg>
